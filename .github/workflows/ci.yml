name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run release:check
      - run: npm --prefix apps/vscode-extension audit --omit=dev
      - run: xvfb-run -a npm run extension:test
      - uses: actions/upload-artifact@v4
        with:
          name: agent-contract-lab-vsix
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error
